name: Build LockIn APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          # GitHub's Actions cache service has intermittent outages ("Our services aren't
          # available right now") that can abort the whole build before it even compiles
          # anything. The cache is a speed optimization, not a requirement — disabling it
          # trades a slightly slower build for one that isn't at the mercy of that outage.
          cache-disabled: true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockIn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
